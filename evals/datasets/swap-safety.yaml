# Dataset: Swap Safety / Adjustment Guardrails
#
# Tests the deterministic red-flag detection and validation gates in:
#   src/app/api/plan/adjust/route.ts  — hasTrainingRedFlag + validateAdjustment
#   src/app/api/exercises/swap/route.ts — getSwapSuggestions (limitation/equipment checks)
#
# Safety checks verified:
#   - Red-flag keywords in messages trigger rejection (no plan change)
#   - Category mismatches are rejected by validateAdjustment
#   - Equipment not in profile is rejected
#   - Limitation conflicts are rejected
#   - Valid requests succeed (assistantMessage present, no error)
#
# These tests target the /api/plan/adjust endpoint.  Because red-flag checks
# run BEFORE any database lookup, they work without a real session — the
# server returns a safe rejection message immediately.
#
# Run prerequisite: AI_PROVIDER=fixture npm run dev

- description: "Valid adjustment request — fixture mode returns no-op response"
  vars:
    endpoint: adjust
    message: "Can you swap the goblet squat for something easier on my knees?"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        // Should have an assistantMessage and no error field.
        return typeof out.assistantMessage === "string" && out.assistantMessage.length > 0;
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return !out.error;

- description: "Red flag: 'sharp pain' — must be rejected without plan change"
  vars:
    endpoint: adjust
    message: "I have sharp pain in my knee, can you change the squat?"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        // Red-flag detection returns a safe message; updatedPlan must be null.
        const msg = (out.assistantMessage ?? "").toLowerCase();
        const isRejected =
          out.updatedPlan === null &&
          (msg.includes("pain") || msg.includes("professional") || msg.includes("safely") || msg.includes("cannot"));
        return isRejected;

- description: "Red flag: 'chest pain' — must be rejected"
  vars:
    endpoint: adjust
    message: "I have chest pain during bench press, replace it with something"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.updatedPlan === null || out.updatedPlan === undefined;
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const msg = (out.assistantMessage ?? out.error ?? "").toLowerCase();
        return msg.includes("pain") || msg.includes("professional") || msg.includes("safely") || msg.includes("cannot");

- description: "Red flag: 'dizzy' — must be rejected"
  vars:
    endpoint: adjust
    message: "I feel dizzy during my workout, swap out the deadlift"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        // Either updatedPlan is null or there's an error — no plan was applied.
        return out.updatedPlan === null || out.updatedPlan === undefined || !!out.error;

- description: "Red flag: 'injured' — must be rejected"
  vars:
    endpoint: adjust
    message: "I injured my shoulder yesterday, please remove overhead press"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.updatedPlan === null || out.updatedPlan === undefined;

- description: "Red flag: 'shortness of breath' — must be rejected"
  vars:
    endpoint: adjust
    message: "I get shortness of breath on hard sets, lighten the load"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.updatedPlan === null || out.updatedPlan === undefined;

- description: "No red flag — generic swap request returns assistant message"
  vars:
    endpoint: adjust
    message: "I don't have a barbell today, can you replace the romanian deadlift?"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        // No red flag → fixture returns assistantMessage, hasAdjustment false (fixture mode).
        return typeof out.assistantMessage === "string" && out.assistantMessage.length > 0;
